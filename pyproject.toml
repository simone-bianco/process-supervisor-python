[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "process-supervisor-python"
version = "0.1.0"
description = "Windows-first process supervisor for Laravel queue workers, scheduler, and Reverb"
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2"]

[project.scripts]
process-supervisor-python = "py_laravel_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"